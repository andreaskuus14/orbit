name: AI quality checks

on:
  push:
    branches: [main]
  pull_request: # every PR: typecheck, tests, AI evals, build

permissions:
  contents: read

concurrency:
  group: ai-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # The existing bridge test skips when no signed-in Claude CLI is available.
      # All synthetic evaluation and ordinary unit tests still run.
      ORBIT_CLAUDE_BIN: /nonexistent/orbit-test-claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      # Reproducible install from the committed lockfile; fails if package.json and the lockfile disagree.
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run eval:ai
      - run: npx next build

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Skips the real Claude CLI bridge test; no Claude login exists in CI.
      ORBIT_CLAUDE_BIN: /nonexistent/orbit-test-claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # engines.node is ">=22.6"; 22 is the oldest supported major.
          node-version: '22'
          cache: npm
          # shortcut: no lockfile is committed, so the npm cache keys on package.json; switch to package-lock.json once one is.
          cache-dependency-path: package.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Test
        run: npm test
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

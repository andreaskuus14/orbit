name: Windows install check (release candidate)
# Throwaway branch: the release candidate b6721c3 plus only this workflow and .github/windows-check/. Never merged.
on:
  push:
    branches: [ci/windows-install-b6721c3]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Isolated data dir
        shell: pwsh
        run: '"ORBIT_DATA_DIR=$env:RUNNER_TEMP\orbit-data" >> $env:GITHUB_ENV'
      - name: Only workflow files differ from b6721c3
        shell: pwsh
        run: |
          git diff --stat b6721c3 HEAD
          git diff --name-only b6721c3 HEAD | ForEach-Object { if ($_ -notlike ".github/*") { throw "app file differs: $_" } }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: npm 12 (enforces allowScripts)
        run: npm install -g npm@12 && node -v && npm -v
      - name: Clean install (npm ci), no blocked install scripts
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object -FilePath npm-ci.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Select-String -Path npm-ci.log -Pattern "install scripts blocked" -Quiet) { throw "npm blocked install scripts" }
      - name: Native dependencies work (sharp, onnxruntime-node, ffmpeg-static, esbuild, protobufjs)
        run: node .github/windows-check/deps.mjs
      - name: Crash and error-policy regression on Windows (committed test files, no substitution)
        run: node --test --experimental-strip-types tests/fetch-gzip-crash.test.ts tests/briefing-crash-policy.test.ts tests/safe-fetch-body.test.ts
      - name: Minimal isolated .env.local (no real Supabase or keys)
        shell: pwsh
        run: |
          Set-Content .env.local "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321`nNEXT_PUBLIC_SUPABASE_ANON_KEY=dummy`nORBIT_DATA_DIR=$env:ORBIT_DATA_DIR`nORBIT_CLAUDE_BIN=C:\nonexistent\claude.exe"
      - name: CI-only probe route (never committed) that throws uncaught, like a stray stream error
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/app/api/health/ci-throw | Out-Null
          Set-Content src/app/api/health/ci-throw/route.ts 'export const dynamic = "force-dynamic"; export function GET() { setTimeout(() => { throw new Error("ci probe: uncaught") }, 50); return Response.json({ thrown: true }); }'
      - name: Build and start the way the PC does (npm run app:rebuild)
        shell: pwsh
        run: |
          npm run app:rebuild
          if ($LASTEXITCODE) { Get-Content orbit-build.log -Tail 60 -ErrorAction SilentlyContinue; Get-Content orbit-server.log -Tail 60 -ErrorAction SilentlyContinue; exit $LASTEXITCODE }
      - name: Startup smoke (health, login page, Doctor commit stamp source, server log)
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $h = Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 5; if ($h.ok) { $ok = $true; break } } catch { }; Start-Sleep 2 }
          if (-not $ok) { Get-Content orbit-server.log -Tail 80; throw "health never answered" }
          "health: $($h | ConvertTo-Json -Compress)"
          $l = Invoke-WebRequest http://127.0.0.1:3000/login -UseBasicParsing -TimeoutSec 30; "login: $($l.StatusCode), $($l.Content.Length) bytes"
          if ($l.StatusCode -ne 200) { throw "login page $($l.StatusCode)" }
          Start-Sleep 20  # past the 15 s Doctor boot self-test and first scheduler tick
          "--- orbit-server.log (tail) ---"; Get-Content orbit-server.log -Tail 40
          if (Select-String -Path orbit-server.log -Pattern "uncaught|Z_BUF_ERROR|ERR_DLOPEN|Cannot find module" -Quiet) { throw "error in server log" }
          if (-not (Get-Process -Id ((Get-Content orbit-server.pid -ErrorAction SilentlyContinue) -split '\s+' | Where-Object { $_ } | Select-Object -Last 1) -ErrorAction SilentlyContinue)) { "note: pid file check inconclusive" }
      - name: Controlled stop (uncaught exception) exits 70 and restarts without a rebuild, even in the first 60 s
        shell: pwsh
        run: |
          function Wait-Up { for ($i = 0; $i -lt 60; $i++) { try { $h = Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 5; if ($h.ok) { return $h } } catch { }; Start-Sleep 1 }; Get-Content orbit-launcher.log -Tail 30; throw "server didn't come back" }
          function Throw-Once($n) {
            $before = (Wait-Up).uptimeSec
            $t0 = Get-Date
            Invoke-RestMethod http://127.0.0.1:3000/api/health/ci-throw -TimeoutSec 5 | Out-Null
            Start-Sleep 4
            $h = Wait-Up
            $secs = [int]((Get-Date) - $t0).TotalSeconds
            "throw $n at uptime $before s: back after $secs s (uptime $($h.uptimeSec) s)"
            if ($secs -gt 45) { throw "slow restart ($secs s): looks like a rebuild" }
            return $before
          }
          $u1 = Throw-Once 1
          $u2 = Throw-Once 2
          if ($u2 -ge 60) { throw "second throw wasn't inside the 60 s boot window ($u2 s)" }
          "--- orbit-launcher.log (tail) ---"; Get-Content orbit-launcher.log -Tail 12
          $exits = Select-String -Path orbit-launcher.log -Pattern "exited unexpectedly \(code (\d+)\)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
          "exit codes: $exits"
          if (@($exits | Where-Object { $_ -eq '70' }).Count -lt 2) { throw "expected two exits with code 70 through cmd /c npm.cmd run start" }
          if (@(Select-String -Path orbit-launcher.log -Pattern "Controlled stop after an uncaught error").Count -lt 2) { throw "supervisor didn't take the controlled-stop path" }
          if (Test-Path orbit-build.log) { $b = (Get-Item orbit-build.log).LastWriteTime; "build log last written $b" }
          $log = Get-Content "$env:ORBIT_DATA_DIR\crash.log" -Raw
          if (([regex]::Matches($log, "ci probe: uncaught")).Count -lt 2) { throw "crash.log missing the probe errors" }
          "crash.log has both probe errors"
      - name: Supervisor restarts the server after an unexpected exit (what a fatal uncaught exception does)
        shell: pwsh
        run: |
          $ids = (Get-Content orbit-server.pid) -split '\s+' | Where-Object { $_ }
          "pid file: $ids"
          # launch.ps1 treats an exit within 60 s of start as a broken build and rebuilds once; this checks the ordinary restart.
          do { $before = (Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 5).uptimeSec; if ($before -lt 65) { Start-Sleep 5 } } while ($before -lt 65)
          taskkill /PID $ids[-1] /T /F
          Start-Sleep 3
          $down = $true; try { Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 2 | Out-Null; $down = $false } catch { }
          "server down right after the kill: $down"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $h = Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 5; if ($h.ok) { $ok = $true; break } } catch { }; Start-Sleep 2 }
          if (-not $ok) { Get-Content orbit-launcher.log -Tail 30; throw "supervisor didn't bring the server back" }
          "back: uptime $($h.uptimeSec) s (was $before s before the kill)"
          "--- orbit-launcher.log (tail) ---"; Get-Content orbit-launcher.log -Tail 8
          if (-not (Select-String -Path orbit-launcher.log -Pattern "Restarting in" -Quiet)) { throw "no supervisor restart in the launcher log" }
      - name: Stop the way the PC does (npm run app:stop) and check nothing is left
        shell: pwsh
        run: |
          npm run app:stop
          Start-Sleep 3
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.IndexOf("$env:GITHUB_WORKSPACE", [StringComparison]::OrdinalIgnoreCase) -ge 0 -and $_.Name -match 'node|cmd|powershell' -and $_.ProcessId -ne $PID }
          $left | Select-Object ProcessId, Name, CommandLine | Format-List
          try { Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 3; throw "server still answering after app:stop" } catch { if ($_.Exception.Message -like "*still answering*") { throw } ; "server stopped" }
          if ($left) { throw "processes left after app:stop" }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-logs
          path: |
            npm-ci.log
            orbit-server.log
            orbit-build.log
            orbit-launcher.log
          if-no-files-found: ignore

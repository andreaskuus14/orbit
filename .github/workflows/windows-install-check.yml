name: Windows restart-policy check (main a336a0b)
# Throwaway branch: the release candidate a336a0b plus only this workflow and .github/windows-check/. Never merged.
on:
  push:
    branches: [ci/windows-restart-a336a0b]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Isolated data dir
        shell: pwsh
        run: '"ORBIT_DATA_DIR=$env:RUNNER_TEMP\orbit-data" >> $env:GITHUB_ENV'
      - name: Only workflow files differ from a336a0b
        shell: pwsh
        run: |
          git diff --stat a336a0b HEAD
          git diff --name-only a336a0b HEAD | ForEach-Object { if ($_ -notlike ".github/*") { throw "app file differs: $_" } }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: npm 12 (enforces allowScripts)
        run: npm install -g npm@12 && node -v && npm -v
      - name: Clean install (npm ci), no blocked install scripts
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object -FilePath npm-ci.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Select-String -Path npm-ci.log -Pattern "install scripts blocked" -Quiet) { throw "npm blocked install scripts" }
      - name: Native dependencies work (sharp, onnxruntime-node, ffmpeg-static, esbuild, protobufjs)
        run: node .github/windows-check/deps.mjs
      - name: Crash and error-policy regression on Windows (committed test files, no substitution)
        run: node --test --experimental-strip-types tests/fetch-gzip-crash.test.ts tests/briefing-crash-policy.test.ts tests/safe-fetch-body.test.ts
      - name: Minimal isolated .env.local (no real Supabase or keys)
        shell: pwsh
        run: |
          Set-Content .env.local "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321`nNEXT_PUBLIC_SUPABASE_ANON_KEY=dummy`nORBIT_DATA_DIR=$env:ORBIT_DATA_DIR`nORBIT_CLAUDE_BIN=C:\nonexistent\claude.exe"
      - name: Build and start the way the PC does (npm run app:rebuild)
        shell: pwsh
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}\.github\windows-check\crash-plan.cjs
        run: |
          npm run app:rebuild
          if ($LASTEXITCODE) { Get-Content orbit-build.log -Tail 60 -ErrorAction SilentlyContinue; Get-Content orbit-server.log -Tail 60 -ErrorAction SilentlyContinue; exit $LASTEXITCODE }
      - name: Startup smoke (health, login page, Doctor commit stamp source, server log)
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $h = Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 5; if ($h.ok) { $ok = $true; break } } catch { }; Start-Sleep 2 }
          if (-not $ok) { Get-Content orbit-server.log -Tail 80; throw "health never answered" }
          "health: $($h | ConvertTo-Json -Compress)"
          $l = Invoke-WebRequest http://127.0.0.1:3000/login -UseBasicParsing -TimeoutSec 30; "login: $($l.StatusCode), $($l.Content.Length) bytes"
          if ($l.StatusCode -ne 200) { throw "login page $($l.StatusCode)" }
          Start-Sleep 20  # past the 15 s Doctor boot self-test and first scheduler tick
          "--- orbit-server.log (tail) ---"; Get-Content orbit-server.log -Tail 40
          if (Select-String -Path orbit-server.log -Pattern "uncaught|Z_BUF_ERROR|ERR_DLOPEN|Cannot find module" -Quiet) { throw "error in server log" }
          if (-not (Get-Process -Id ((Get-Content orbit-server.pid -ErrorAction SilentlyContinue) -split '\s+' | Where-Object { $_ } | Select-Object -Last 1) -ErrorAction SilentlyContinue)) { "note: pid file check inconclusive" }
      - name: Controlled crash in the first minute restarts without a rebuild; a genuine early exit still rebuilds once
        shell: pwsh
        run: |
          function Health { try { Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 3 } catch { $null } }
          function WaitBack([int]$sec) { $t0 = Get-Date; while (((Get-Date) - $t0).TotalSeconds -lt $sec) { $h = Health; if ($h.ok) { return $h }; Start-Sleep 1 }; return $null }
          $h = Health; "uptime before the planned crash: $($h.uptimeSec) s"
          if ($h.uptimeSec -ge 50) { throw "server already past the 60 s window; the check needs a fresh start" }
          $mark = (Get-Content orbit-launcher.log).Count
          Set-Content "$env:ORBIT_DATA_DIR\crash-plan.txt" "throw"
          $t0 = Get-Date; Start-Sleep 4
          $h = WaitBack 60
          if (-not $h) { Get-Content orbit-launcher.log | Select-Object -Skip $mark; throw "not back within 60 s after the controlled stop" }
          "back after the controlled stop in $([int]((Get-Date) - $t0).TotalSeconds) s, uptime $($h.uptimeSec) s"
          $new = Get-Content orbit-launcher.log | Select-Object -Skip $mark; "--- launcher log ---"; $new
          if (-not ($new -match "exited unexpectedly \(code 70\)")) { throw "exit code 70 didn't reach the supervisor" }
          if ($new -match "Building ORBIT") { throw "controlled stop triggered a rebuild" }
          "--- crash.log ---"; Get-Content "$env:ORBIT_DATA_DIR\crash.log"
          if (-not (Select-String -Path "$env:ORBIT_DATA_DIR\crash.log" -Pattern "uncaughtException PLANNED Error: windows check: planned uncaught exception token=\[redacted\]" -Quiet)) { throw "crash.log entry missing or not redacted" }
          if (Select-String -Path "$env:ORBIT_DATA_DIR\crash.log",orbit-server.log -Pattern "PLANSECRET123456" -Quiet) { throw "secret leaked into a log" }
          # genuine startup failure: exit 1 within 60 s of start → one rebuild, then back
          $mark = (Get-Content orbit-launcher.log).Count
          Set-Content "$env:ORBIT_DATA_DIR\crash-plan.txt" "exit1"
          Start-Sleep 5
          $h = WaitBack 600
          $new = Get-Content orbit-launcher.log | Select-Object -Skip $mark; "--- launcher log ---"; $new
          if (-not $h) { throw "not back within 10 min after the exit 1" }
          if (-not ($new -match "exited unexpectedly \(code 1\)")) { throw "exit 1 not seen" }
          if (-not ($new -match "Building ORBIT")) { throw "a genuine early exit didn't rebuild" }
          "back after the rebuild, uptime $($h.uptimeSec) s"
      - name: Stop the way the PC does (npm run app:stop) and check nothing is left
        shell: pwsh
        run: |
          npm run app:stop
          Start-Sleep 3
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.IndexOf("$env:GITHUB_WORKSPACE", [StringComparison]::OrdinalIgnoreCase) -ge 0 -and $_.Name -match 'node|cmd|powershell' -and $_.ProcessId -ne $PID }
          $left | Select-Object ProcessId, Name, CommandLine | Format-List
          try { Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 3; throw "server still answering after app:stop" } catch { if ($_.Exception.Message -like "*still answering*") { throw } ; "server stopped" }
          if ($left) { throw "processes left after app:stop" }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-logs
          path: |
            npm-ci.log
            orbit-server.log
            orbit-build.log
            orbit-launcher.log
          if-no-files-found: ignore

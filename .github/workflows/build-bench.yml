name: Build speed bench

# Measures the live-build options for scripts/launch.ps1 side by side on a throwaway 16 GB Linux runner: the normal webpack
# build (the same flags launch.ps1 uses: ORBIT_DIST_DIR=.next-build, ORBIT_FAST_PROD_BUILD=1) cold and warm, the warm build
# without the kept .rscinfo (what launch.ps1 did before), and `next build --turbopack` cold and warm. Wall time and peak RSS
# (/usr/bin/time -v) go to the job summary. No secrets, never the owner's PC. Start it from the Actions tab or by pushing
# to ci/build-bench.
on:
  push:
    branches: [ci/build-bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --no-audit --no-fund
        env: { ONNXRUNTIME_NODE_INSTALL_CUDA: skip }
      - name: Bench
        run: |
          set -u
          echo "| Run | Exit | Wall | Peak RSS, all processes | Peak RSS, largest process |" > bench.md; echo "|---|---|---|---|---|" >> bench.md
          # Sums the RSS of every node process once a second (next build's workers are separate processes); prints the peak.
          sampler() { local peak=0 s; while [ ! -f stop ]; do s=$(ps -C node -o rss= | awk '{t+=$1} END {print t+0}'); [ "$s" -gt "$peak" ] && peak=$s; sleep 1; done; echo $peak > peak.txt; }
          run() { # label, then the command
            local label=$1; shift
            rm -f stop peak.txt; sampler & local sp=$!
            /usr/bin/time -v -o time.txt "$@" > "build-$label.log" 2>&1; local code=$?
            touch stop; wait $sp
            local wall=$(grep 'Elapsed (wall' time.txt | awk '{print $NF}'); local rss=$(grep 'Maximum resident' time.txt | awk '{print $NF}')
            echo "| $label | $code | $wall | $(( $(cat peak.txt) / 1024 )) MB | $((rss/1024)) MB |" >> bench.md
            tail -25 "build-$label.log"
          }
          # Simulates a pulled commit: one source line changes between builds.
          edit() { echo "// bench $1" >> src/app/layout.tsx; }
          swap() { rm -rf .next; mv .next-build .next; } # what Switch-Release does
          # launch.ps1 before this change: only cache/webpack moved over. After: .rscinfo is kept too.
          carry() { mkdir -p .next-build/cache; mv .next/cache/webpack .next-build/cache/webpack; if [ "$1" = keep ]; then cp .next/cache/.rscinfo .next-build/cache/; fi; }
          export ORBIT_DIST_DIR=.next-build ORBIT_FAST_PROD_BUILD=1
          run webpack-cold npx next build; swap
          edit 1; carry drop; run webpack-warm-old npx next build; swap
          edit 2; carry keep; run webpack-warm-new npx next build; swap
          edit 3; carry keep; run webpack-warm-new-2 npx next build; swap
          rm -rf .next .next-build
          run turbopack-cold npx next build --turbopack; swap
          edit 4; mkdir -p .next-build; mv .next/cache .next-build/cache 2>/dev/null; run turbopack-warm npx next build --turbopack
          cat bench.md >> "$GITHUB_STEP_SUMMARY"; cat bench.md
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with: { name: build-bench, path: "build-*.log", retention-days: 14 }

name: Agent 8 partial restore (Windows)
on:
  push:
    branches: [test/agent8-partial-restore]
permissions:
  contents: read
jobs:
  run:
    strategy: { matrix: { os: [windows-latest] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: git rev-parse HEAD
      - run: node --experimental-strip-types scripts/agent8/partial-restore.ts

name: Self-dev test runner (Windows)

# Proves the orbit-test runner on a throwaway Windows VM (supervisor/windows/ci-test-runner.ps1): the builder's tests run as
# orbit-test via the SYSTEM supervisor, can't read planted canary credentials or change spending settings, and can't reach the
# network (child processes included); a negative control disables the rule. No secrets, no model. Never touches the PC.
on:
  push:
    branches: [selfdev-test-runner]
    paths: ["supervisor/**", "selfdev/**", ".github/workflows/selfdev-test-runner.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfdev-test-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the runner, probe it, negative control
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File supervisor\windows\ci-test-runner.ps1
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfdev-test-runner
          path: selfdev-test-runner/
          retention-days: 14
